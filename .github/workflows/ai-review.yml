name: AI Code Review

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai_review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Extract PR metadata
        id: metadata
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const issueMatch = pr.data.body.match(/#(\d+)/);
            let issueBody = "No issue referenced.";
            if (issueMatch) {
              const issueNumber = issueMatch[1];
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              issueBody = issue.data.title + "\n\n" + issue.data.body;
            }

            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // Get file contents for each changed file
            const fileContents = await Promise.all(
              files.data.map(async (file) => {
                const content = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: file.filename,
                  ref: pr.data.head.sha,
                });
                return {
                  filename: file.filename,
                  content: Buffer.from(content.data.content, 'base64').toString()
                };
              })
            );

            const changedFiles = fileContents.map(file =>
              `### ${file.filename}\n\`\`\`\n${file.content}\n\`\`\``
            ).join('\n\n');

            core.setOutput("prTitle", pr.data.title);
            core.setOutput("prBody", pr.data.body);
            core.setOutput("issueBody", issueBody);
            core.setOutput("changedFiles", changedFiles);
            core.setOutput("repoUrl", `https://github.com/${context.repo.owner}/${context.repo.repo}`);
            core.setOutput("commitSha", pr.data.head.sha);

      - name: Run AI review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_TITLE: ${{ steps.metadata.outputs.prTitle }}
          PR_BODY: ${{ steps.metadata.outputs.prBody }}
          ISSUE_BODY: ${{ steps.metadata.outputs.issueBody }}
          CHANGED_FILES: ${{ steps.metadata.outputs.changedFiles }}
          REPO_URL: ${{ steps.metadata.outputs.repoUrl }}
          COMMIT_SHA: ${{ steps.metadata.outputs.commitSha }}
        run: |
          echo "Instalando dependencias..."
          pip install openai

          echo "Generando prompt..."
          python3 << 'EOF'
          from openai import OpenAI
          import os

          client = OpenAI(api_key=os.getenv("OPENAI_API_KEY"))

          pr_title = os.getenv("PR_TITLE", "")
          pr_body = os.getenv("PR_BODY", "")
          issue_body = os.getenv("ISSUE_BODY", "")
          changed_files = os.getenv("CHANGED_FILES", "")

          prompt = f"""
          Eres un revisor de código que evalúa Pull Requests en una aplicación de nómina hecha en React.

          A continuación tienes el título y descripción del PR:
          {pr_title}
          {pr_body}

          Y el issue que lo origina (descripción, pasos, checklist):
          {issue_body}

          Los siguientes archivos fueron modificados con su contenido:
          {changed_files}

          Realiza una revisión detallada como si fueras un desarrollador senior:
          1. Evalúa si los cambios cumplen con el objetivo del issue.
          2. Revisa si hay buenas prácticas en React (JSX, hooks, nombres, etc).
          3. Revisa exhaustivamente la ortografía en español de todos los textos visibles al usuario:
             - Mensajes de error
             - Labels de formularios
             - Botones
             - Títulos
             - Cualquier otro texto visible
          4. Sugiere mejoras de código si las hay.
          5. Verifica que no haya código comentado o console.logs.
          6. Asegúrate que los nombres de variables y funciones sean descriptivos y en inglés.
          7. Revisa la consistencia en el estilo de los textos (mayúsculas/minúsculas, acentos).
          8. Revisa que no se suban errores que un linter señalaría, como funciones sin usar, variables sin usar, etc.
          9. Verifica que los nombres de los archivos y carpetas sean descriptivos y en inglés.

          IMPORTANTE: Para cada problema que encuentres, especifica:
          - El archivo exacto (filename)
          - El número de línea o rango de líneas donde está el problema
          - Un título claro del problema
          - Una descripción detallada del problema
          - La sugerencia de corrección específica

          Responde SOLO en formato JSON con la siguiente estructura:
          {{
            "summary": "Resumen general de la revisión",
            "issues": [
              {{
                "title": "Título claro del problema (ej: 'Error ortográfico en label del formulario')",
                "description": "Descripción detallada del problema y por qué es importante corregirlo",
                "path": "ruta/del/archivo.tsx",
                "startLine": numero_de_linea_inicio,
                "endLine": numero_de_linea_fin,
                "suggestion": "Sugerencia específica de cómo corregirlo",
                "severity": "error|warning|suggestion"
              }}
            ],
            "general_feedback": "Comentarios generales sobre el PR"
          }}
          """

          try:
              response = client.chat.completions.create(
                  model="gpt-3.5-turbo",
                  messages=[
                      {"role": "system", "content": "Eres un revisor de código senior especializado en React y con excelente dominio del español. Responde SIEMPRE en formato JSON válido."},
                      {"role": "user", "content": prompt}
                  ],
                  temperature=0.7,
                  max_tokens=2000
              )

              review_content = response.choices[0].message.content

              # Guardar la respuesta JSON para procesamiento
              with open("review.json", "w", encoding="utf-8") as f:
                  f.write(review_content)

          except Exception as e:
              print(f"Error al generar la revisión: {str(e)}")
              exit(1)
          EOF

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const reviewData = JSON.parse(fs.readFileSync('review.json', 'utf8'));

              let commentBody = '## 🤖 Revisión Automática de Código\n\n';

              // Agregar resumen si existe
              if (reviewData.summary) {
                commentBody += `### Resumen\n${reviewData.summary}\n\n`;
              }

              // Procesar cada issue encontrado
              if (reviewData.issues && reviewData.issues.length > 0) {
                for (const issue of reviewData.issues) {
                  const severityEmoji = {
                    'error': '🚨',
                    'warning': '⚠️',
                    'suggestion': '💡'
                  }[issue.severity] || '📝';

                  commentBody += `<details open>\n`;
                  commentBody += `<summary><h3>${severityEmoji} ${issue.title}</h3></summary>\n\n`;
                  commentBody += `${issue.description}\n\n`;

                  if (issue.suggestion) {
                    commentBody += `**💡 Sugerencia:** ${issue.suggestion}\n\n`;
                  }

                  commentBody += `<p></p>\n\n`;

                  // Crear enlace al código
                  const repoUrl = process.env.REPO_URL || context.payload.repository.html_url;
                  const commitSha = process.env.COMMIT_SHA || context.payload.pull_request.head.sha;

                  let linkRange = '';
                  if (issue.startLine === issue.endLine) {
                    linkRange = `#L${issue.startLine}`;
                  } else {
                    linkRange = `#L${issue.startLine}-L${issue.endLine}`;
                  }

                  const codeUrl = `${repoUrl}/blob/${commitSha}/${issue.path}${linkRange}`;

                  commentBody += `<details>\n`;
                  commentBody += `<summary><code>${issue.path}${linkRange}</code></summary>\n\n`;
                  commentBody += `${codeUrl}\n\n`;
                  commentBody += `</details>\n\n`;
                  commentBody += `</details>\n\n`;
                }
              } else {
                commentBody += '✅ No se encontraron problemas en este PR.\n\n';
              }

              // Agregar feedback general si existe
              if (reviewData.general_feedback) {
                commentBody += `### Comentarios Generales\n${reviewData.general_feedback}\n\n`;
              }

              commentBody += '---\n*Revisión automática generada por IA*';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });

              console.log(`Revisión completada: ${reviewData.issues?.length || 0} problemas encontrados`);

            } catch (error) {
              console.log(`Error procesando la revisión: ${error.message}`);

              // Fallback: crear comentario con el contenido raw
              const rawContent = fs.readFileSync('review.json', 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 Revisión Automática de Código\n\n⚠️ Hubo un error procesando la revisión. Contenido raw:\n\n\`\`\`json\n${rawContent}\n\`\`\``
              });
            }
